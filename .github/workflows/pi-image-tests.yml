name: Pi update helper

# Runs the shell tests of the Pi card: the update helper on the Pi (tools/pi-image/in-pi/update-chatter.sh),
# the round trip with the release script, and the scripts that build the card. npm test does not run them.
# The helper tests need Linux tools and run in a Debian container (tools/pi-image/test/in-linux.sh).
# The other tests run on the runner, which has Docker. A guardrail test (tools/guardrails) fails when
# a tools/pi-image/test/*.test.sh file is not named in a workflow.
# The paths are the helper, its tests, the release script and the files that the round trip reads,
# and the status contract in packages/shared.

on:
  push:
    branches: [main]
    paths:
      - 'tools/pi-image/**'
      - 'tools/release/**'
      - 'packages/shared/src/updates.ts'
      - 'docker-compose.yml'
      - 'vmalert/rules.yml'
      - '.github/workflows/pi-image-tests.yml'
  # Each pull request, also one in a stack that targets another branch (see ci.yml)
  pull_request:
    paths:
      - 'tools/pi-image/**'
      - 'tools/release/**'
      - 'packages/shared/src/updates.ts'
      - 'docker-compose.yml'
      - 'vmalert/rules.yml'
      - '.github/workflows/pi-image-tests.yml'

permissions:
  contents: read

# A new push to a pull request stops the run of the push before it. Runs on main always finish.
concurrency:
  group: pi-image-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  update-helper:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Test the update helper, the round trip, and the card folders
        run: |
          tools/pi-image/test/in-linux.sh \
            tools/pi-image/test/update-chatter-check.test.sh \
            tools/pi-image/test/update-chatter-install.test.sh \
            tools/pi-image/test/update-chatter-recover.test.sh \
            tools/pi-image/test/update-chatter-diagnostics.test.sh \
            tools/pi-image/test/update-file-round-trip.test.sh \
            tools/pi-image/test/customize-update.test.sh

      # Each script runs, also when one before it fails, so the log shows all the failures
      - name: Test the card build scripts and the update folder mounts
        run: |
          status=0
          for test_script in \
            tools/pi-image/test/build-version.test.sh \
            tools/pi-image/test/imager-list.test.sh \
            tools/pi-image/test/load-images.test.sh \
            tools/pi-image/test/update-mounts.test.sh; do
            echo "==> $test_script"
            "$test_script" || status=1
          done
          exit "$status"
