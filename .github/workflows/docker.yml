# Build the Docker image for each processor. A release tag also publishes it to the GitHub Container Registry
# (ghcr.io). Users can then pull the image, instead of building it on a small computer such as a Raspberry Pi.
#
# Image: ghcr.io/toolpath/chatter (the name that docker-compose.yml uses)
# Tags:
#   a push to main       -> nothing is published: the build only checks that the images build
#   a tag such as v2.1.0 -> 2.1.0, 2.1, and latest
#   a pre-release        -> 2.1.0 only. Make the GitHub Release as a pre-release before the tag, for example
#                           gh release create v2.1.0 --target main --prerelease. When it becomes public,
#                           release-tags.yml gives it 2.1 and latest.
# Each image on ghcr.io uses storage. ghcr-cleanup.yml deletes the parts that no tagged image uses.
# A release tag also gets the signed update file for the Pi, the Docker packages for computers, and the Pi card image
# on its GitHub Release. Only a tag on main publishes: the jobs stop for a tag on another branch.
#
# After the first publish, make the package "chatter" public in the organisation's Packages settings.

name: Docker image

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']

# Each job gets only the permissions that it needs
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # packages: write pushes the images of a tag. A push to main only builds.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The check below needs the history of main
          fetch-depth: 0

      # Only a commit on main can become a release. A tag on another branch publishes nothing.
      - name: Check that the tag is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: tools/release/check-tag-on-main.sh

      # Emulates the ARM processors on the Intel build computer
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A pre-release is for tests: it must not move the tags that users pull, such as latest
      - name: Find out if the release is a pre-release
        id: release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A tag with no GitHub Release yet is a normal release: the sign job makes its Release (add-to-release.sh)
          prerelease="$(gh release view "$GITHUB_REF_NAME" --json isPrerelease --jq .isPrerelease 2> /dev/null || echo false)"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Pre-release: $prerelease"

      # The same image name as in docker-compose.yml. ghcr.io needs lowercase names.
      - name: Make the image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/toolpath/chatter
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.release.outputs.prerelease != 'true' }}
          flavor: |
            latest=${{ steps.release.outputs.prerelease == 'true' && 'false' || 'auto' }}

      # The version that the app shows, and that the update helper on the Pi compares.
      # A tag such as v1.2.0 gives 1.2.0. A push to main gives edge-<the first 7 characters of the commit>.
      - name: Choose the app version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=edge-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # Only a tag publishes. A push to main builds the images and fills the build cache for the next release.
      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          build-args: |
            CHATTER_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Makes the signed update file that Settings > Updates installs on the Pi card, and adds it to the GitHub Release
  # of the tag. Only for a release tag such as v1.2.0. A pre-release tag such as v1.2.0-rc1 publishes images, but
  # makes no update file.
  # Each Pi card installs a signed update as root, so this job is small: it runs no action except the checkout, and it
  # is the only job that gets the signing key. The key is a secret of the "release" Environment, which gives the
  # secret only to v[0-9]* tags. tools/guardrails checks these rules.
  sign:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    environment: release
    # contents: write adds the update file to the release. packages: read pulls the Chatter image of the release.
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The check below needs the history of main
          fetch-depth: 0

      - name: Check that the tag is on main
        run: tools/release/check-tag-on-main.sh

      # A login is not needed for a public package, but it avoids the pull limits of ghcr.io.
      # A run step, and not an action, so that no action runs in this job.
      - name: Log in to the GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # The update file for the Pi card. Only the update helper uses update files, and only the Pi card has the helper.
      # The script refuses a tag that is not like v1.2.0.
      # UPDATE_KEY_ID is an optional variable of the Environment. Without it, the key name is chatter-2026.
      - name: Make the signed update file
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_KEY_ID: ${{ vars.UPDATE_KEY_ID }}
        run: tools/release/make-update-file.sh "${GITHUB_REF_NAME#v}" armv7 update-files

      - name: Add the update file to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: tools/release/add-to-release.sh "$GITHUB_REF_NAME" update-files/*.tar

  # Makes the Docker packages for computers, and adds them to the GitHub Release of the tag, with the table
  # "Which file do I need?". It runs after the sign job, so the release has the update file too.
  # It has the condition of the sign job too, so it never runs for a push to main. tools/guardrails checks it.
  release:
    needs: sign
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    # contents: write adds the files to the release. packages: read pulls the Chatter images of the release.
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # A login is not needed for a public package, but it avoids the pull limits of ghcr.io
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Chatter for a computer, with the images in the zip, so it needs no download from ghcr.io
      - name: Make the Docker packages for computers
        run: |
          for arch in amd64 arm64; do
            tools/release/make-docker-package.sh "${GITHUB_REF_NAME#v}" "$arch" docker-packages
          done

      - name: Add the files to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tools/release/add-to-release.sh "$GITHUB_REF_NAME" docker-packages/*.zip
          tools/release/add-download-table.sh "$GITHUB_REF_NAME"

  # Makes the Raspberry Pi card image of the release, after the update file. See card.yml.
  card:
    needs: release
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/card.yml
    with:
      tag: ${{ github.ref_name }}
