# Dependabot opens pull requests that update the dependencies.
#
# github-actions: each workflow pins its actions by a full commit, with the version in a comment
# (tools/guardrails checks this). Dependabot updates the commit and the comment together.
# npm: the app (the root lockfile covers apps/server, apps/web and packages/shared) and the docs site.
# One pull request for each group, once a month, so that the updates do not fill the list of pull requests.
# Security updates (a setting of the repo on GitHub) do not wait for this schedule.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directories:
      - /
      - /docs
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # CI, the Docker image and the Pi run Node 22. Newer types describe functions that Node 22 does not have.
      # Change this limit together with the Node major in ci.yml and in the Dockerfile.
      - dependency-name: '@types/node'
        versions: ['>=23']
      # typescript-eslint supports only TypeScript below 6.1, so the lint would stay on TypeScript 5.
      # Do this update by hand when typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # koffi calls the FANUC FOCAS library. Test a new major on a real FANUC control, on x64 and on a 32-bit Pi, before the update.
      - dependency-name: koffi
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore
